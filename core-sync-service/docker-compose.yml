##
##  Core Sync Service — Docker Compose
##
##  Usage:
##    1. cp .env.example .env  and fill in every value
##    2. docker compose up -d
##
##  All sensitive values come from the .env file. Never hardcode them here.
##

version: '3.9'

services:

  # ── Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env          # All variables are loaded from .env
    environment:
      # Override datasource URL to use the compose network alias "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coresync
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_MODEL: ${AI_API_MODEL:-gpt-3.5-turbo}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      # ACTION REQUIRED: Set your allowed front-end origins before deploying.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Set SWAGGER_ENABLED=false in production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - coresync-network

  # ── Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coresync
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d coresync"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coresync-network

volumes:
  db-data:

networks:
  coresync-network:
    driver: bridge
