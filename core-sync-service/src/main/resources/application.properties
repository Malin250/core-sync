# ============================================================
#  Core Sync Service - Application Configuration
#  All sensitive values are read from environment variables.
#  Copy .env.example to .env and fill in the real values.
# ============================================================

spring.application.name=Core Sync Service
spring.config.import=optional:file:.env[.properties]

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coresync}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# ACTION REQUIRED: Set to 'false' in production to avoid exposing SQL queries in logs.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT ----------
# ACTION REQUIRED: Generate a strong 256-bit hex secret (e.g. openssl rand -hex 32).
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# Token lifetime in milliseconds (default: 24 hours).
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh-token lifetime in milliseconds (default: 7 days).
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---------- AI API ----------
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
# ACTION REQUIRED: Set your OpenAI / compatible API key.
ai.api.key=${AI_API_KEY}
ai.api.model=${AI_API_MODEL:gpt-3.5-turbo}
ai.system-prompt=${AI_SYSTEM_PROMPT:You are a helpful assistant for the Core Sync Service app. Provide concise and relevant answers.}
ai.chat.history-limit=${AI_CHAT_HISTORY_LIMIT:5}

# ---------- Firebase ----------
# ACTION REQUIRED: Set FIREBASE_SERVICE_ACCOUNT_BASE64 to the base64-encoded
# contents of your Firebase service-account JSON key.
# Generate the key: Firebase Console → Project Settings → Service Accounts → Generate new private key
# Then encode it:   base64 -w 0 serviceAccountKey.json
# For local dev you may instead set FIREBASE_SERVICE_ACCOUNT_PATH to the file path,
# or set FIREBASE_SERVICE_ACCOUNT_RESOURCE to a classpath resource inside the backend.
firebase.service-account.base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
firebase.service-account.resource=${FIREBASE_SERVICE_ACCOUNT_RESOURCE:}

# ACTION REQUIRED: Set to your Firebase Storage bucket name.
# Found in: Firebase Console → Storage → Files (top bar), e.g. your-project-id.appspot.com
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET}

# Maximum profile-picture upload size.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- SSL/HTTPS Configuration ----------
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=coresync
server.ssl.enabled=true

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
# ACTION REQUIRED: Disable Swagger in production by setting to false.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ---------- Rate Limiting ----------
# Disable Bucket4j auto-configuration (we manage buckets in-memory ourselves).
bucket4j.enabled=false

# ---------- Logging ----------
logging.level.com.example.coresyncservice=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
